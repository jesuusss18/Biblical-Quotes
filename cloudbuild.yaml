steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/biblical-backend', './backend']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/biblical-backend']

  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'biblical-backend',
      '--image', 'gcr.io/$PROJECT_ID/biblical-backend',
      '--platform', 'managed',
      '--region', 'us-central1',
      '--allow-unauthenticated',
      '--port', '5000'
    ]

options:
  logging: CLOUD_LOGGING_ONLY
