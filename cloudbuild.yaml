steps:
  # Build frontend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '--build-arg',
        'VITE_API_URL=https://biblical-backend-992642845650.us-central1.run.app',
        '-t',
        'gcr.io/$PROJECT_ID/biblical-frontend',
        './frontend'
      ]

  # Push frontend image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/biblical-frontend']

  # Deploy frontend to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      [
        'run',
        'deploy',
        'biblical-frontend',
        '--image',
        'gcr.io/$PROJECT_ID/biblical-frontend',
        '--platform', 'managed',
        '--region', 'us-central1',
        '--allow-unauthenticated',
        '--port', '80'
      ]

options:
  logging: CLOUD_LOGGING_ONLY
