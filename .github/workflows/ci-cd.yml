# Add your CI/CD workflow here
name: Deploy to GCP

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: docker build -t gcr.io/${{ secrets.GCP_PROJECT }}/biblical-quotes:${{ github.sha }} .

      - name: Authenticate GCP
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Push Docker image
        run: docker push gcr.io/${{ secrets.GCP_PROJECT }}/biblical-quotes:${{ github.sha }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: biblical-quotes
          image: gcr.io/${{ secrets.GCP_PROJECT }}/biblical-quotes:${{ github.sha }}
          region: us-central1
